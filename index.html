<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHILL CLUB FIGHTER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;color:#fff;touch-action:none;}
#game-wrap{position:relative;width:800px;transform-origin:top left;}
#gc{position:relative;width:800px;height:480px;overflow:hidden;
  background:linear-gradient(180deg,#0d0020 0%,#1a0a2e 35%,#2d0a3e 60%,#1a0510 80%,#3a1a05 100%);}
#floor{position:absolute;bottom:80px;left:0;right:0;height:8px;background:#ff6600;box-shadow:0 0 12px #ff6600,0 4px 0 #aa3300;}
#bgcity{position:absolute;bottom:88px;left:0;right:0;height:200px;opacity:.12;
  background:linear-gradient(transparent 38%,#ff00ff 38%) 0/42px 200px,
    linear-gradient(transparent 52%,#8800ff 52%) 55px/58px 200px,
    linear-gradient(transparent 33%,#8800ff 33%) 185px/85px 200px,
    linear-gradient(transparent 58%,#ff00ff 58%) 295px/52px 200px,
    linear-gradient(transparent 43%,#8800ff 43%) 375px/75px 200px,
    linear-gradient(transparent 28%,#8800ff 28%) 558px/92px 200px,
    linear-gradient(transparent 40%,#8800ff 40%) 762px/38px 200px;}
#gc::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:100;}

/* HUD */
#hud{position:absolute;top:8px;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:0 10px;z-index:10;}
.fhud{width:260px;}
.fname{font-size:6px;color:#ffff00;text-shadow:2px 2px #000,0 0 8px #ffff00;margin-bottom:3px;white-space:nowrap;overflow:hidden;}
.hpbg{width:100%;height:14px;background:#333;border:2px solid #666;}
.hp{height:100%;background:#00ff44;transition:width .1s;}
.hp.y{background:#ffff00;}.hp.r{background:#ff2200;animation:hf .3s infinite;}
@keyframes hf{0%,100%{opacity:1}50%{opacity:.4}}
.enbg{width:100%;height:7px;background:#222;border:2px solid #444;margin-top:2px;}
.en{height:100%;background:#00ccff;transition:width .1s;}
.en.full{background:#fff;box-shadow:0 0 6px #00ccff;}
.pips{display:flex;gap:5px;margin-top:3px;}
.pip{width:9px;height:9px;background:#333;border:2px solid #666;}
.pip.won{background:#ff2200;border-color:#ff6600;box-shadow:0 0 6px #ff2200;}
#mid{text-align:center;}
#timer{font-size:20px;color:#fff;text-shadow:0 0 10px #fff,2px 2px #000;}
#rnd{font-size:7px;color:#ff00ff;text-shadow:0 0 8px #ff00ff;margin-bottom:2px;}

/* FIGHTER - face portrait based */
.fighter{position:absolute;width:72px;height:110px;}
.fighter canvas{position:absolute;top:0;left:0;}
.fighter .face-wrap{position:absolute;top:0;left:10px;width:52px;height:52px;overflow:hidden;border:3px solid #fff;image-rendering:pixelated;}
.fighter .face-wrap img{width:100%;height:100%;object-fit:cover;object-position:top center;image-rendering:auto;filter:contrast(1.1) saturate(1.2);}
.fighter .face-glow{position:absolute;top:0;left:10px;width:52px;height:52px;pointer-events:none;}
.fighter .body{position:absolute;top:50px;left:8px;width:56px;height:38px;}
.fighter .legs{position:absolute;top:86px;left:8px;width:56px;height:24px;}
.fighter .shadow-el{position:absolute;bottom:-6px;left:4px;width:64px;height:8px;background:rgba(0,0,0,0.4);border-radius:50%;}

/* state animations */
.fighter.atk .face-wrap{border-color:#ffff00;box-shadow:0 0 10px #ffff00;}
.fighter.atk .body{transform:translateX(8px);}
.fighter.atk-h .face-wrap{border-color:#ff6600;box-shadow:0 0 14px #ff6600;}
.fighter.atk-h .body{transform:translateX(14px) rotate(-5deg);}
.fighter.crouch{transform:scaleY(0.78);transform-origin:bottom center;}
.fighter.block .face-wrap{border-color:#00ff44;box-shadow:0 0 8px #00ff44;}
.fighter.block .body{transform:translateX(-4px);}
.fighter.jump .legs{transform:translateY(-10px) rotate(-10deg);}
.fighter.hit .face-wrap{filter:brightness(3) saturate(0);border-color:#fff;}
.fighter.hit .body{transform:translateX(-6px);}

.fshadow{position:absolute;border-radius:50%;background:rgba(0,0,0,0.35);z-index:1;}

/* FX */
.dmgtxt{position:absolute;font-family:'Press Start 2P',monospace;font-size:10px;color:#ffff00;
  text-shadow:2px 2px #ff0000;pointer-events:none;z-index:50;animation:fu 1s forwards;}
@keyframes fu{0%{opacity:1;transform:translateY(0)}50%{opacity:1;transform:translateY(-30px) scale(1.3)}100%{opacity:0;transform:translateY(-60px) scale(.8)}}
.mvtxt{position:absolute;font-family:'Press Start 2P',monospace;font-size:6px;
  pointer-events:none;z-index:50;animation:mf 1.2s forwards;white-space:nowrap;text-shadow:1px 1px #000;}
@keyframes mf{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.1)}75%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-22px) scale(.8)}}
#sf{position:absolute;top:0;left:0;right:0;bottom:0;background:white;opacity:0;pointer-events:none;z-index:90;transition:opacity .05s;}
.proj{position:absolute;z-index:20;pointer-events:none;}
.shockwave{position:absolute;border-radius:50%;pointer-events:none;z-index:25;animation:shk .45s forwards;}
@keyframes shk{0%{width:10px;height:10px;opacity:1;margin-left:0;margin-top:0}100%{width:160px;height:60px;opacity:0;margin-left:-75px;margin-top:-25px;}}
#ann{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:16px;color:#ffff00;
  text-shadow:0 0 20px #ffff00,4px 4px #000;z-index:150;pointer-events:none;animation:aa 1.5s forwards;text-align:center;max-width:700px;}
@keyframes aa{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

/* Overlays */
.ovl{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;}
.btn{padding:10px 18px;background:#ff00ff;color:#000;border:none;
  font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;box-shadow:4px 4px 0 #880088;margin-top:10px;}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #880088;}
.ovl h1{font-size:12px;color:#ff00ff;text-shadow:0 0 20px #ff00ff,3px 3px #000;margin-bottom:8px;text-align:center;line-height:2;}
.ovl h2{font-size:8px;color:#ffff00;margin-bottom:8px;text-align:center;}
.ovl p{font-size:5px;color:#aaa;margin:2px 0;line-height:1.8;}

/* CHARACTER SELECT */
#char-select{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#000 0%,#0a0015 100%);z-index:300;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 16px;}
#char-select h1{font-size:9px;color:#ffff00;text-shadow:0 0 12px #ffff00;margin-bottom:3px;}
#char-select h2{font-size:5px;color:#ff00ff;margin-bottom:10px;}
#cs-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;width:100%;}
.cs-card{background:#0a0010;border:2px solid #333;cursor:pointer;text-align:center;padding:3px 2px;
  transition:border-color .12s,box-shadow .12s;position:relative;}
.cs-card:hover,.cs-card.sel{border-color:#ff00ff;box-shadow:0 0 10px #ff00ff44;}
.cs-card.sel{border-color:#ffff00;box-shadow:0 0 12px #ffff0088;}
.cs-card img{width:100%;aspect-ratio:1;object-fit:cover;object-position:top center;display:block;filter:contrast(1.1);}
.cs-card .cs-name{font-size:4px;color:#fff;margin-top:2px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-card .cs-tag{font-size:3px;margin-top:1px;line-height:1.3;}
#cs-bottom{margin-top:8px;display:flex;gap:16px;align-items:flex-start;width:100%;}
.cs-preview{text-align:center;min-width:100px;}
.cs-preview img{width:80px;height:80px;object-fit:cover;object-position:top center;border:3px solid #ff00ff;display:block;margin:0 auto;filter:contrast(1.1);}
.cs-preview .cs-pname{font-size:6px;color:#ffff00;margin-top:4px;}
.cs-preview .cs-pdesc{font-size:3.5px;color:#aaa;margin-top:3px;line-height:1.7;max-width:110px;}
.cs-preview .cs-moves{font-size:3px;color:#00ffcc;margin-top:4px;line-height:1.8;max-width:110px;text-align:left;}
#cs-mid{display:flex;flex-direction:column;align-items:center;flex:1;}
#cs-vs{font-size:14px;color:#ff4444;text-shadow:0 0 12px #ff4444;padding:0 8px;}
#ctrl{position:absolute;bottom:4px;left:8px;font-size:4px;color:#555;z-index:10;line-height:2;}

/* TOUCH */
#touch-ctrl{display:none;width:100%;max-width:800px;padding:6px;background:#0a0a0f;
  justify-content:space-between;align-items:flex-end;gap:5px;touch-action:none;user-select:none;}
#tc-left,#tc-right{display:flex;flex-direction:column;gap:4px;}
.tc-row{display:flex;gap:4px;}
.tcb{font-family:'Press Start 2P',monospace;font-size:6px;padding:10px 6px;background:#111122;color:#fff;
  border:2px solid #444;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  min-width:42px;text-align:center;line-height:1.3;box-shadow:0 3px 0 #000;}
.tcb:active{transform:translateY(2px);box-shadow:none;}
.t-mv{border-color:#666;}.t-mv:active{background:#666;color:#000;}
.t-jump{border-color:#fff;font-size:8px;}.t-jump:active{background:#fff;color:#000;}
.t-blk{border-color:#00ff44;}.t-blk:active{background:#00ff44;color:#000;}
.t-j{border-color:#ffff00;}.t-j:active{background:#ffff00;color:#000;}
.t-k{border-color:#ff6600;}.t-k:active{background:#ff6600;color:#000;}
.t-u{border-color:#00ffff;}.t-u:active{background:#00ffff;color:#000;}
.t-i{border-color:#ff00ff;}.t-i:active{background:#ff00ff;color:#000;}
.t-sup{border-color:#ffff00;background:#1a1500;font-size:5px;}.t-sup:active{background:#ffff00;color:#000;}

@media(max-width:820px){
  body{align-items:flex-start;}
  #game-wrap{width:100vw;}
  #touch-ctrl{display:flex!important;}
  #ctrl{display:none;}
  #char-select h1{font-size:7px!important;}
  #cs-grid{grid-template-columns:repeat(4,1fr)!important;}
}
</style>
</head>

</div>

function buildFighter(el, char, facingRight){
  el.innerHTML = '';
  el.style.width = '72px';
  el.style.height = '110px';

  // Face portrait
  const faceWrap = document.createElement('div');
  faceWrap.className = 'face-wrap';
  faceWrap.style.borderColor = char.color;
  const img = document.createElement('img');
  img.src = char.img;
  img.alt = char.short;
  img.draggable = false;
  // pixelate slightly for retro feel
  img.style.filter = `contrast(1.15) saturate(1.3)`;
  faceWrap.appendChild(img);
  el.appendChild(faceWrap);

  // Scanline overlay on face
  const scan = document.createElement('div');
  scan.className = 'face-glow';
  scan.style.cssText = `background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,0.18) 3px,rgba(0,0,0,0.18) 4px);pointer-events:none;`;
  el.appendChild(scan);

  // Body
  const body = document.createElement('div');
  body.className = 'body';
  body.style.cssText = `background:${char.color};border:2px solid ${char.accent};border-radius:2px;`;
  el.appendChild(body);

  // Legs
  const legs = document.createElement('div');
  legs.className = 'legs';
  legs.innerHTML = `<div style="position:absolute;left:2px;width:24px;height:24px;background:${char.accent};border:1px solid ${char.color};border-radius:1px;"></div>
    <div style="position:absolute;left:30px;width:24px;height:24px;background:${char.accent};border:1px solid ${char.color};border-radius:1px;"></div>`;
  el.appendChild(legs);

  // Name tag under feet
  const tag = document.createElement('div');
  tag.style.cssText = `position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);font-size:4px;color:${char.color};white-space:nowrap;text-shadow:1px 1px #000;font-family:'Press Start 2P',monospace;`;
  tag.textContent = char.short;
  el.appendChild(tag);

  // Flip if facing left
  el.style.transform = facingRight ? '' : 'scaleX(-1)';
}

let selIdx = null, opIdx = null;

function buildCharSelect(){
  const grid = document.getElementById('cs-grid');
  grid.innerHTML = '';
  CHARS.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'cs-card';
    card.innerHTML = `<img src="${c.img}" alt="${c.short}" onerror="this.src='data:image/svg+xml,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'80\\' height=\\'80\\'><rect width=\\'80\\' height=\\'80\\' fill=\\'%23222\\'/></svg>'">
      <div class="cs-name" style="color:${c.color}">${c.short}</div>
      <div class="cs-tag" style="color:${c.accent}">${c.desc.split('.')[0]}</div>`;
    card.onclick = () => selectChar(i);
    grid.appendChild(card);
  });
}

function selectChar(i){
  selIdx = i;
  document.querySelectorAll('.cs-card').forEach((c,j) => c.classList.toggle('sel', j===i));
  const c = CHARS[i];
  document.getElementById('prev1-img').src = c.img;
  document.getElementById('prev1-img').style.borderColor = c.color;
  document.getElementById('prev1-name').textContent = c.short;
  document.getElementById('prev1-name').style.color = c.color;
  document.getElementById('prev1-desc').textContent = c.desc;
  document.getElementById('prev1-moves').innerHTML =
    `L: ${c.moves.light.stand.n}<br>K: ${c.moves.heavy.stand.n}<br>WAVE: ${c.moves.wave.n}<br>★: ${c.moves.super.n}`;

  let op = Math.floor(Math.random()*CHARS.length);
  while(op===i) op = Math.floor(Math.random()*CHARS.length);
  opIdx = op;
  const oc = CHARS[op];
  document.getElementById('prev2-img').src = oc.img;
  document.getElementById('prev2-img').style.borderColor = oc.color;
  document.getElementById('prev2-name').textContent = oc.short;
  document.getElementById('prev2-name').style.color = oc.color;
  document.getElementById('prev2-desc').textContent = oc.desc;
  document.getElementById('prev2-moves').innerHTML =
    `L: ${oc.moves.light.stand.n}<br>WAVE: ${oc.moves.wave.n}<br>★: ${oc.moves.super.n}`;

  document.getElementById('cs-start').style.display = 'block';
  document.getElementById('cs-hint').textContent = 'ready to fight!';
}

function startFromSelect(){
  if(selIdx === null) return;
  document.getElementById('char-select').style.display = 'none';
  initGame(selIdx, opIdx);
}

function showCharSelect(){
  document.getElementById('char-select').style.display = 'flex';
  document.getElementById('es').style.display = 'none';
  document.getElementById('ks').style.display = 'none';
  selIdx = null; opIdx = null;
  document.getElementById('cs-start').style.display = 'none';
  document.getElementById('cs-hint').textContent = '← tap to select';
  buildCharSelect();
}

const SL=40, SR=700, FW=72, FH=110;
const GROUND_Y=480-88-FH;
const GRAVITY=0.65, FASTFALL_V=8;
const MHP=100, MEN=100, RT=60;

let G={running:false,round:1,w1:0,w2:0,timer:RT,ti:null,p1:null,p2:null,c1:null,c2:null,keys:{},gl:null,ais:'approach',ait:1};

function makePlayer(x){return{hp:MHP,en:0,x,y:GROUND_Y,vy:0,state:'STAND',facing:1,cd:0,jumpAttacked:false,blk:false};}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function p1e(){return document.getElementById('p1');}
function p2e(){return document.getElementById('p2');}

function initGame(p1i, p2i){
  G.round=1; G.w1=0; G.w2=0;
  G.c1=CHARS[p1i]; G.c2=CHARS[p2i];
  document.getElementById('name1').textContent=G.c1.short;
  document.getElementById('name1').style.color=G.c1.color;
  document.getElementById('name2').textContent=G.c2.short;
  document.getElementById('name2').style.color=G.c2.color;
  document.getElementById('rn').textContent=1;
  buildFighter(p1e(), G.c1, true);
  buildFighter(p2e(), G.c2, false);
  document.getElementById('floor').style.background=G.c1.color;
  document.getElementById('floor').style.boxShadow=`0 0 12px ${G.c1.color},0 4px 0 ${G.c2.color}`;
  updatePips();
  resetRound();
  G.running=true;
  ann('ROUND 1');
  setTimeout(()=>ann('FIGHT!'),1500);
  startTimer();
  lt=performance.now(); requestAnimationFrame(loop);
}

function resetRound(){
  G.p1=makePlayer(80); G.p2=makePlayer(620);
  G.p1.facing=1; G.p2.facing=-1;
  G.ais='approach'; G.ait=1;
  [p1e(),p2e()].forEach(e=>e.classList.remove('atk','atk-h','crouch','block','jump','hit'));
  hud(); pos();
  document.getElementById('ks').style.display='none';
}

function hud(){
  const q1=G.p1.hp/MHP*100,q2=G.p2.hp/MHP*100;
  const h1=document.getElementById('h1'),h2=document.getElementById('h2');
  h1.style.width=q1+'%'; h2.style.width=q2+'%';
  h1.className='hp'+(q1<=25?' r':q1<=50?' y':'');
  h2.className='hp'+(q2<=25?' r':q2<=50?' y':'');
  document.getElementById('e1').style.width=(G.p1.en/MEN*100)+'%';
  document.getElementById('e2').style.width=(G.p2.en/MEN*100)+'%';
  document.getElementById('e1').className='en'+(G.p1.en>=MEN?' full':'');
  document.getElementById('e2').className='en'+(G.p2.en>=MEN?' full':'');
  document.getElementById('timer').textContent=Math.ceil(G.timer);
}
function pos(){
  const p1=p1e(),p2=p2e();
  p1.style.left=G.p1.x+'px'; p1.style.top=G.p1.y+'px';
  p2.style.left=G.p2.x+'px'; p2.style.top=G.p2.y+'px';
  function shadow(sh,p){
    const h=cl(1-(GROUND_Y-p.y)/160,0.1,1),w=cl(24+26*h,18,56);
    sh.style.cssText=`width:${w}px;height:8px;left:${p.x+(FW-w)/2}px;top:${GROUND_Y+FH+2}px;opacity:${h*0.4};`;
  }
  shadow(document.getElementById('sh1'),G.p1);
  shadow(document.getElementById('sh2'),G.p2);
}

const gc=document.getElementById('gc'),sfe=document.getElementById('sf');
function flash(c){sfe.style.background=c;sfe.style.opacity='.6';setTimeout(()=>sfe.style.opacity='0',85);}
function dmgTxt(x,y,d,c){const el=document.createElement('div');el.className='dmgtxt';el.textContent='-'+d;el.style.cssText=`left:${cl(x,10,750)}px;top:${cl(y,60,360)}px;color:${c||'#ffff00'}`;gc.appendChild(el);setTimeout(()=>el.remove(),1000);}
function mvTxt(x,y,n,c){const el=document.createElement('div');el.className='mvtxt';el.textContent=n;el.style.cssText=`left:${cl(x,0,660)}px;top:${cl(y,50,340)}px;color:${c||'#ff00ff'}`;gc.appendChild(el);setTimeout(()=>el.remove(),1200);}
function ann(t,d=1500){const o=document.getElementById('ann');if(o)o.remove();const el=document.createElement('div');el.id='ann';el.textContent=t;el.style.animationDuration=d+'ms';gc.appendChild(el);setTimeout(()=>el.remove(),d);}

function dealDamage(atk,def,isP2,dmgAmt,moveName,kb,color){
  if(!G.running)return;
  if(def.state==='BLOCK'&&def.blk){
    if(!isP2&&Math.random()<0.38) setTimeout(()=>dealDamage(G.p2,G.p1,false,12,'COUNTER!',0,G.c2.color),220);
    dmgAmt=Math.round(dmgAmt*0.1);
    mvTxt(def.x,def.y,'BLOCKED!','#888');
  }
  def.hp=Math.max(0,def.hp-dmgAmt);
  atk.en=Math.min(MEN,atk.en+8); def.en=Math.min(MEN,def.en+5);
  def.state='HIT';
  const defEl=isP2?p2e():p1e();
  defEl.classList.add('hit'); setTimeout(()=>{defEl.classList.remove('hit');if(def.state==='HIT')def.state='STAND';},200);
  if(dmgAmt>14) flash(color||'#ffffff');
  if(isP2){dmgTxt(def.x,def.y+40,dmgAmt,'#ffff00');if(moveName)mvTxt(atk.x,def.y-10,moveName,color);if(kb)def.x=cl(def.x+kb,SL,SR);}
  else{dmgTxt(def.x,def.y+40,dmgAmt,'#ff6666');if(moveName)mvTxt(cl(def.x-70,0,700),def.y-10,moveName,color);if(kb)def.x=cl(def.x-kb,SL,SR);}
  if(def.hp<=0)endRound();
}

function doJump(p,el){
  if(p.state==='JUMP')return;
  const c=p===G.p1?G.c1:G.c2;
  p.vy=c.stats.jump||-15; p.state='JUMP'; p.jumpAttacked=false; el.classList.add('jump');
}

function physics(){
  [G.p1,G.p2].forEach((p,i)=>{
    if(p.state==='JUMP'){p.vy+=GRAVITY;p.y+=p.vy;if(p.y>=GROUND_Y){p.y=GROUND_Y;p.vy=0;if(p.state==='JUMP')p.state='STAND';p.jumpAttacked=false;(i===0?p1e():p2e()).classList.remove('jump');}}
    else p.y=GROUND_Y;
  });
  const og1=G.p1.state!=='JUMP',og2=G.p2.state!=='JUMP';
  if(og1&&og2){const ov=(G.p1.x+FW+4)-G.p2.x;if(ov>0){G.p1.x-=ov*0.5;G.p2.x+=ov*0.5;}}
  G.p1.x=cl(G.p1.x,SL,SR);G.p2.x=cl(G.p2.x,SL,SR);
}

function spawnBullet(isP2){
  const p=isP2?G.p2:G.p1,op=isP2?G.p1:G.p2,c=isP2?G.c2:G.c1;
  const el=document.createElement('div');el.className='proj';
  const dir=p.facing;let x=dir>0?p.x+FW:p.x-14,y=p.y+50+Math.random()*12;
  el.style.cssText=`top:${y}px;left:${x}px;width:14px;height:8px;border-radius:4px;background:${c.color};box-shadow:0 0 8px ${c.color}`;
  gc.appendChild(el);
  const id=setInterval(()=>{x+=dir*13;el.style.left=x+'px';if(Math.abs(x-op.x)<FW&&y>op.y&&y<op.y+FH){dealDamage(p,op,isP2,4,null,0,c.color);el.remove();clearInterval(id);}if(x>880||x<-50){el.remove();clearInterval(id);}},28);
}

function spawnWave(isP2){
  const p=isP2?G.p2:G.p1,op=isP2?G.p1:G.p2,c=isP2?G.c2:G.c1;
  const M=c.moves.wave;
  mvTxt(p.x,p.y+20,M.n,M.wc||c.color);
  const el=document.createElement('div');el.className='proj';
  const dir=p.facing;let x=dir>0?p.x+FW:p.x-22,y=p.y+30,size=22,hit=false;
  el.style.cssText=`top:${y}px;left:${x}px;width:${size}px;height:${size}px;border-radius:50%;border:3px solid ${M.wc||c.color};box-shadow:0 0 12px ${M.wc||c.color}`;
  gc.appendChild(el);
  const id=setInterval(()=>{x+=dir*9;size=Math.min(size+2.5,60);const yo=(size-22)/2;el.style.left=x+'px';el.style.top=(y-yo)+'px';el.style.width=size+'px';el.style.height=size+'px';
    if(!hit&&Math.abs(x-op.x)<FW+size/2&&(y-yo)<op.y+FH&&(y-yo+size)>op.y){dealDamage(p,op,isP2,22,M.n,35,M.wc||c.color);hit=true;el.remove();clearInterval(id);}
    if(x>880||x<-60){el.remove();clearInterval(id);}},22);
}

function spawnShockwave(x,y,color){
  const el=document.createElement('div');el.className='shockwave';
  el.style.cssText=`left:${x+FW/2}px;top:${y+FH-14}px;border:4px solid ${color};box-shadow:0 0 20px ${color}`;
  gc.appendChild(el);setTimeout(()=>el.remove(),450);
}

function doAttack(p,isP2,type){
  if(!G.running||p.cd>0)return;
  const c=isP2?G.c2:G.c1,op=isP2?G.p1:G.p2;
  const inAir=p.state==='JUMP',crouch=p.state==='CROUCH';
  const sk=inAir?'air':crouch?'crouch':'stand';
  const am=c.stats.atkMult||1;
  const el=isP2?p2e():p1e();

  if(type==='wave'){const M=c.moves.wave;if(p.en<M.ec)return;p.en-=M.ec;p.cd=M.cd;spawnWave(isP2);return;}
  if(type==='super'){const M=c.moves.super;if(p.en<M.ec)return;p.en-=M.ec;p.cd=M.cd;flash(M.flashC||c.color);ann(M.n+'!!');dealDamage(p,op,isP2,Math.round(M.d*am),M.n,0,M.flashC||c.color);return;}
  if(type==='special'){const M=c.moves.special[sk];if(!M)return;if(p.en<25)return;p.en-=25;p.cd=M.cd;mvTxt(p.x,p.y+30,M.n,c.color);for(let i=0;i<(M.multi||5);i++)setTimeout(()=>spawnBullet(isP2),i*90);return;}

  const MG=c.moves[type];if(!MG)return;
  const M=MG[sk];if(!M)return;
  p.cd=M.cd;
  el.classList.add(M.d>18?'atk-h':'atk');
  setTimeout(()=>{el.classList.remove('atk','atk-h');if(p.state==='ATTACK'||p.state==='ATK-H')p.state=inAir?'JUMP':'STAND';},220);

  if(M.bassDrop){
    mvTxt(p.x,p.y+10,M.n,c.color);
    const dist=Math.abs(op.x-p.x);
    if(dist<M.rng)dealDamage(p,op,isP2,Math.round(M.d*am),null,0,c.color);
    const lc=setInterval(()=>{if(p.state!=='JUMP'){spawnShockwave(p.x,p.y,c.color);flash(c.color);if(Math.abs(op.x-p.x)<150)dealDamage(p,op,isP2,10,'SHOCKWAVE',45,c.color);clearInterval(lc);}},40);
    return;
  }
  const dist=Math.abs(op.x-p.x);
  if(dist<M.rng+(inAir?30:0)){dealDamage(p,op,isP2,Math.round(M.d*am),M.n,M.kb||0,c.color);p.en=Math.min(MEN,p.en+8);}
}

function runAI(dt){
  const dist=Math.abs(G.p2.x-G.p1.x);
  G.ait-=dt;if(G.p2.cd>0)G.p2.cd-=dt*60;
  if(G.ait<=0){
    const r=Math.random();
    if(G.p2.hp<30&&G.p2.en>=MEN)G.ais='super';
    else if(dist>180)G.ais='approach';
    else if(r<.25)G.ais='light';
    else if(r<.42)G.ais='heavy';
    else if(r<.55&&G.p2.en>=25)G.ais='special';
    else if(r<.63&&G.p2.en>=30)G.ais='wave';
    else if(r<.72)G.ais='jump';
    else if(r<.84)G.ais='block';
    else G.ais='retreat';
    G.ait=.3+Math.random()*.7;
  }
  if(G.p2.cd>0)return;
  const tw=G.p1.x<G.p2.x?-2:2,aw=G.p1.x<G.p2.x?1.5:-1.5;
  switch(G.ais){
    case 'approach':G.p2.x=cl(G.p2.x+tw,SL,SR);G.p2.state='WALK';break;
    case 'retreat': G.p2.x=cl(G.p2.x+aw,SL,SR);G.p2.state='WALK';break;
    case 'light':   doAttack(G.p2,true,'light');break;
    case 'heavy':   doAttack(G.p2,true,'heavy');break;
    case 'special': doAttack(G.p2,true,'special');break;
    case 'wave':    doAttack(G.p2,true,'wave');break;
    case 'jump':    doJump(G.p2,p2e());break;
    case 'super':   doAttack(G.p2,true,'super');break;
    case 'block':
      G.p2.blk=true;G.p2.state='BLOCK';p2e().classList.add('block');
      setTimeout(()=>{G.p2.blk=false;if(G.p2.state==='BLOCK'){G.p2.state='STAND';p2e().classList.remove('block');}},550);break;
  }
}

let lastKT={a:0,d:0};
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();G.keys[k]=true;
  if(!G.running)return;
  if(k==='a'||k==='d'){const now=Date.now(),dir=k==='a'?-1:1;if(now-lastKT[k]<200&&G.p1.state!=='JUMP'){G.p1.x=cl(G.p1.x+dir*85,SL,SR);mvTxt(G.p1.x,G.p1.y+20,dir>0?'DASH →':'← DASH','#fff');}lastKT[k]=now;}
  switch(k){
    case 'w':doJump(G.p1,p1e());break;
    case 's':if(G.p1.state==='JUMP')G.p1.vy=Math.max(G.p1.vy,FASTFALL_V);else{G.p1.state='CROUCH';p1e().classList.add('crouch');}break;
    case 'j':doAttack(G.p1,false,'light');break;
    case 'k':doAttack(G.p1,false,'heavy');break;
    case 'u':doAttack(G.p1,false,'special');break;
    case 'i':doAttack(G.p1,false,'wave');break;
    case 'l':doAttack(G.p1,false,'super');break;
  }
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();G.keys[k]=false;
  if(k==='s'){G.p1.state='STAND';p1e().classList.remove('crouch');}
  if(k==='a'&&G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
});

let lt=0;
function loop(ts){
  if(!G.running)return;
  const dt=Math.min((ts-lt)/1000,.05);lt=ts;
  const spd=(G.p1.state!=='JUMP'?(G.c1.stats.spd||3.5):2.8);
  const onG=G.p1.state!=='JUMP';
  if(G.keys['a']){
    G.p1.x=cl(G.p1.x-spd,SL,SR);
    if(onG&&G.p1.state!=='CROUCH'&&G.p1.state!=='HIT'&&G.p1.state!=='ATTACK'&&G.p2.x>G.p1.x){G.p1.blk=true;G.p1.state='BLOCK';p1e().classList.add('block');}
  } else if(G.keys['d']){
    G.p1.x=cl(G.p1.x+spd,SL,SR);
    if(onG&&G.p1.state!=='CROUCH'&&G.p1.state!=='HIT'&&G.p1.state!=='ATTACK'&&G.p2.x<G.p1.x){G.p1.blk=true;G.p1.state='BLOCK';p1e().classList.add('block');}
    else if(G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
  } else {
    if(G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
  }
  if(G.p1.cd>0)G.p1.cd-=dt*60;
  physics();
  if(G.p1.state!=='ATTACK'&&G.p1.state!=='ATK-H'){const f=G.p2.x>G.p1.x?1:-1;if(f!==G.p1.facing){G.p1.facing=f;p1e().style.transform=f===1?'':'scaleX(-1)';}}
  if(G.p2.state!=='ATTACK'&&G.p2.state!=='ATK-H'){const f=G.p1.x>G.p2.x?1:-1;if(f!==G.p2.facing){G.p2.facing=f;p2e().style.transform=f===1?'scaleX(-1)':'';}}
  runAI(dt);hud();pos();
  G.gl=requestAnimationFrame(loop);
}

function startTimer(){G.timer=RT;G.ti=setInterval(()=>{if(!G.running)return;G.timer--;if(G.timer<=0){G.timer=0;endRound(true);}},1000);}
function endRound(to=false){
  if(!G.running)return;
  G.running=false;cancelAnimationFrame(G.gl);clearInterval(G.ti);
  const w=to?(G.p1.hp>=G.p2.hp?1:2):(G.p1.hp<=0?2:1);
  if(w===1)G.w1++;else G.w2++;updatePips();ann(to?'TIME!':'K.O.!');
  setTimeout(()=>{
    if(G.w1>=2||G.w2>=2){endGame();return;}
    document.getElementById('kt').textContent=to?'TIME!':'K.O.!';
    document.getElementById('kw').textContent=w===1?`🏆 ${G.c1.short} WINS!`:`🏆 ${G.c2.short} WINS!`;
    document.getElementById('ksc').textContent=`${G.c1.short} ${G.w1} - ${G.w2} ${G.c2.short}`;
    document.getElementById('ks').style.display='flex';
  },1800);
}
function nextRound(){
  G.round++;document.getElementById('rn').textContent=G.round;resetRound();ann('ROUND '+G.round);
  setTimeout(()=>{ann('FIGHT!');G.running=true;startTimer();lt=performance.now();requestAnimationFrame(loop);},1500);
}
function endGame(){
  document.getElementById('et').textContent=G.w1>G.w2?'YOU WIN!':'GAME OVER';
  document.getElementById('ew').textContent=G.w1>G.w2?`🏆 ${G.c1.short} CHAMPION!`:`🏆 ${G.c2.short} WINS!`;
  document.getElementById('es').style.display='flex';
}
function updatePips(){for(let i=0;i<2;i++){document.getElementById('p1p'+i).className='pip'+(i<G.w1?' won':'');document.getElementById('p2p'+i).className='pip'+(i<G.w2?' won':'');}}

// Touch
function bindBtn(id,onD,onU){const el=document.getElementById(id);if(!el)return;el.addEventListener('touchstart',e=>{e.preventDefault();onD();},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();if(onU)onU();},{passive:false});el.addEventListener('mousedown',onD);if(onU)el.addEventListener('mouseup',onU);}
bindBtn('tc-jump',()=>{if(G.running&&G.p1)doJump(G.p1,p1e());});
bindBtn('tc-dn',()=>{G.keys['s']=true;if(G.running&&G.p1){if(G.p1.state==='JUMP')G.p1.vy=Math.max(G.p1.vy,FASTFALL_V);else{G.p1.state='CROUCH';p1e().classList.add('crouch');}}},()=>{G.keys['s']=false;if(G.p1&&G.p1.state==='CROUCH'){G.p1.state='STAND';p1e().classList.remove('crouch');}});
bindBtn('tc-lb',()=>{G.keys['a']=true;},()=>{G.keys['a']=false;if(G.p1&&G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}});
bindBtn('tc-rb',()=>{G.keys['d']=true;},()=>{G.keys['d']=false;});
bindBtn('tc-block',()=>{if(G.p1){G.p1.blk=true;G.p1.state='BLOCK';p1e().classList.add('block');}},()=>{if(G.p1){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}});
bindBtn('tc-j',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'light');});
bindBtn('tc-k',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'heavy');});
bindBtn('tc-u',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'special');});
bindBtn('tc-i',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'wave');});
bindBtn('tc-sup',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'super');});

function scaleGame(){const wrap=document.getElementById('game-wrap');const avail=Math.min(window.innerWidth,800);if(avail<800){const s=avail/800;gc.style.transformOrigin='top left';gc.style.transform='scale('+s+')';wrap.style.height=(480*s)+'px';}else{gc.style.transform='';wrap.style.height='480px';}}
scaleGame();window.addEventListener('resize',scaleGame);
buildCharSelect();
</script>
