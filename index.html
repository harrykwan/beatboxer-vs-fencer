<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CHILL CLUB FIGHTER</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0f;font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden;color:#fff;touch-action:none;}
#game-wrap{position:relative;width:800px;transform-origin:top left;}
#gc{position:relative;width:800px;height:480px;overflow:hidden;}

/* BG themes per matchup */
#gc.bg-default{background:linear-gradient(180deg,#0d0020 0%,#1a0a2e 35%,#2d0a3e 60%,#1a0510 80%,#3a1a05 100%);}
#gc.bg-stage{background:linear-gradient(180deg,#000 0%,#0a0020 20%,#1a0050 50%,#050010 80%,#000 100%);}
#floor{position:absolute;bottom:80px;left:0;right:0;height:8px;background:#ff6600;box-shadow:0 0 12px #ff6600,0 4px 0 #aa3300;}
#bgcity{position:absolute;bottom:88px;left:0;right:0;height:200px;opacity:.12;
  background:
    linear-gradient(transparent 38%,#ff00ff 38%) 0/42px 200px,
    linear-gradient(transparent 52%,#8800ff 52%) 55px/58px 200px,
    linear-gradient(transparent 33%,#8800ff 33%) 185px/85px 200px,
    linear-gradient(transparent 58%,#ff00ff 58%) 295px/52px 200px,
    linear-gradient(transparent 43%,#8800ff 43%) 375px/75px 200px,
    linear-gradient(transparent 28%,#8800ff 28%) 558px/92px 200px,
    linear-gradient(transparent 40%,#8800ff 40%) 762px/38px 200px;}
#gc::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);
  pointer-events:none;z-index:100;}

/* HUD */
#hud{position:absolute;top:8px;left:0;right:0;display:flex;align-items:flex-start;justify-content:space-between;padding:0 12px;z-index:10;}
.fhud{width:270px;}
.fname{font-size:6px;color:#ffff00;text-shadow:2px 2px #000,0 0 8px #ffff00;margin-bottom:4px;white-space:nowrap;overflow:hidden;}
.hpbg{width:100%;height:14px;background:#333;border:2px solid #666;}
.hp{height:100%;background:#00ff44;transition:width .1s;}
.hp.y{background:#ffff00;}.hp.r{background:#ff2200;animation:hf .3s infinite;}
@keyframes hf{0%,100%{opacity:1}50%{opacity:.4}}
.enbg{width:100%;height:7px;background:#222;border:2px solid #444;margin-top:2px;}
.en{height:100%;background:#00ccff;transition:width .1s;}
.en.full{background:#fff;box-shadow:0 0 6px #00ccff;}
.pips{display:flex;gap:5px;margin-top:3px;}
.pip{width:9px;height:9px;background:#333;border:2px solid #666;}
.pip.won{background:#ff2200;border-color:#ff6600;box-shadow:0 0 6px #ff2200;}
#mid{text-align:center;}
#timer{font-size:20px;color:#fff;text-shadow:0 0 10px #fff,2px 2px #000;}
#rnd{font-size:7px;color:#ff00ff;text-shadow:0 0 8px #ff00ff;margin-bottom:2px;}

.fshadow{position:absolute;border-radius:50%;background:rgba(0,0,0,0.35);z-index:1;}

/* FIGHTER SPRITES — base */
.fighter{position:absolute;width:64px;height:96px;}
.pb{position:absolute;}

/* FX */
.dmgtxt{position:absolute;font-family:'Press Start 2P',monospace;font-size:11px;color:#ffff00;
  text-shadow:2px 2px #ff0000;pointer-events:none;z-index:50;animation:fu 1s forwards;}
@keyframes fu{0%{opacity:1;transform:translateY(0)}50%{opacity:1;transform:translateY(-32px) scale(1.3)}100%{opacity:0;transform:translateY(-64px) scale(.8)}}
.mvtxt{position:absolute;font-family:'Press Start 2P',monospace;font-size:7px;
  pointer-events:none;z-index:50;animation:mf 1.1s forwards;white-space:nowrap;text-shadow:1px 1px #000;}
@keyframes mf{0%{opacity:0;transform:scale(.4)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-24px) scale(.8)}}
#sf{position:absolute;top:0;left:0;right:0;bottom:0;background:white;opacity:0;pointer-events:none;z-index:90;transition:opacity .05s;}
.proj{position:absolute;z-index:20;pointer-events:none;}
.shockwave{position:absolute;border-radius:50%;pointer-events:none;z-index:25;animation:shk .45s forwards;}
@keyframes shk{0%{width:10px;height:10px;opacity:1;margin-left:0;margin-top:0}100%{width:160px;height:60px;opacity:0;margin-left:-75px;margin-top:-25px;}}
#ann{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:18px;color:#ffff00;text-shadow:0 0 20px #ffff00,4px 4px #000;z-index:150;pointer-events:none;animation:aa 1.5s forwards;}
@keyframes aa{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}

/* Overlays */
.ovl{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;}
.btn{padding:10px 18px;background:#ff00ff;color:#000;border:none;
  font-family:'Press Start 2P',monospace;font-size:8px;cursor:pointer;box-shadow:4px 4px 0 #880088;margin-top:12px;}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #880088;}
.ovl h1{font-size:13px;color:#ff00ff;text-shadow:0 0 20px #ff00ff,3px 3px #000;margin-bottom:8px;text-align:center;line-height:2;}
.ovl h2{font-size:9px;color:#ffff00;margin-bottom:10px;text-align:center;}
.ovl p{font-size:5px;color:#aaa;margin:2px 0;line-height:1.8;}
.ovl .hi{color:#00ffff;}.ovl .sp{color:#ff00ff;}

/* CHARACTER SELECT */
#char-select{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;}
#char-select h1{font-size:10px;color:#ffff00;text-shadow:0 0 12px #ffff00;margin-bottom:4px;}
#char-select h2{font-size:6px;color:#ff00ff;margin-bottom:12px;}
#cs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;}
.cs-card{background:#111;border:2px solid #333;cursor:pointer;text-align:center;padding:4px 2px;transition:border-color .15s;}
.cs-card:hover,.cs-card.sel{border-color:#ff00ff;background:#1a001a;}
.cs-card.sel{box-shadow:0 0 10px #ff00ff;}
.cs-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;image-rendering:pixelated;}
.cs-card .cs-name{font-size:4px;color:#fff;margin-top:3px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cs-card .cs-style{font-size:3px;color:#888;margin-top:1px;}
#cs-bottom{margin-top:10px;display:flex;gap:20px;align-items:flex-end;}
.cs-preview{text-align:center;}
.cs-preview img{width:70px;height:70px;object-fit:cover;border:3px solid #ff00ff;image-rendering:auto;}
.cs-preview .cs-pname{font-size:6px;color:#ffff00;margin-top:4px;}
.cs-preview .cs-pdesc{font-size:4px;color:#aaa;margin-top:2px;line-height:1.6;max-width:120px;}
#cs-vs{font-size:14px;color:#ff4444;text-shadow:0 0 12px #ff4444;padding:0 10px;}
#cs-p{font-size:5px;color:#ff00ff;margin-top:6px;}
#ctrl{position:absolute;bottom:4px;left:8px;font-size:5px;color:#555;z-index:10;line-height:2;}

/* TOUCH */
#touch-ctrl{display:none;width:100%;max-width:800px;padding:8px;background:#0a0a0f;
  justify-content:space-between;align-items:flex-end;gap:6px;touch-action:none;user-select:none;}
#tc-left,#tc-right{display:flex;flex-direction:column;gap:5px;}
.tc-row{display:flex;gap:5px;}
.tcb{font-family:'Press Start 2P',monospace;font-size:6px;padding:11px 7px;background:#111122;color:#fff;
  border:2px solid #444;border-radius:3px;cursor:pointer;-webkit-tap-highlight-color:transparent;
  min-width:44px;text-align:center;line-height:1.4;box-shadow:0 3px 0 #000;}
.tcb:active{transform:translateY(2px);box-shadow:none;}
.t-mv{border-color:#666;}.t-mv:active{background:#666;color:#000;}
.t-jump{border-color:#fff;font-size:8px;}.t-jump:active{background:#fff;color:#000;}
.t-block{border-color:#00ff44;}.t-block:active{background:#00ff44;color:#000;}
.t-j{border-color:#ffff00;}.t-j:active{background:#ffff00;color:#000;}
.t-k{border-color:#ff6600;}.t-k:active{background:#ff6600;color:#000;}
.t-u{border-color:#00ffff;}.t-u:active{background:#00ffff;color:#000;}
.t-i{border-color:#ff00ff;}.t-i:active{background:#ff00ff;color:#000;}
.t-sup{border-color:#ffff00;background:#1a1500;font-size:5px;}.t-sup:active{background:#ffff00;color:#000;}

@media(max-width:820px){
  body{align-items:flex-start;}
  #game-wrap{width:100vw;}
  #touch-ctrl{display:flex!important;}
  #ctrl{display:none;}
  .ovl h1{font-size:9px!important;}
  .ovl p{font-size:5px!important;}
  .btn{font-size:6px!important;padding:8px 12px!important;}
  #char-select h1{font-size:8px!important;}
  .cs-card .cs-name{font-size:3px!important;}
}
</style>
</head>

      <div class="pips"><div class="pip" id="p1p0"></div><div class="pip" id="p1p1"></div></div>
    </div>
    <div id="mid"><div id="rnd">ROUND <span id="rn">1</span></div><div id="timer">60</div></div>
    <div class="fhud" style="text-align:right">
      <div class="fname" id="name2">P2</div>
      <div class="hpbg"><div class="hp" id="h2" style="float:right"></div></div>
      <div class="enbg"><div class="en" id="e2" style="float:right"></div></div>
      <div class="pips" style="justify-content:flex-end"><div class="pip" id="p2p0"></div><div class="pip" id="p2p1"></div></div>
    </div>
  </div>

  <div class="fshadow" id="sh1"></div>
  <div class="fshadow" id="sh2"></div>
  <div class="fighter" id="p1"></div>
  <div class="fighter" id="p2"></div>

  <div id="ctrl">A/D=WALK &nbsp; W=JUMP &nbsp; S=CROUCH/FASTFALL &nbsp; hold-A(away)=BLOCK &nbsp;|&nbsp; J=LIGHT &nbsp; K=HEAVY &nbsp; U=SPECIAL &nbsp; I=WAVE &nbsp; L=SUPER &nbsp; double-tap=DASH</div>

  <div class="ovl" id="ks" style="display:none">
    <h1 id="kt">K.O.!</h1><h2 id="kw"></h2><p id="ksc"></p>
    <button class="btn" onclick="nextRound()">NEXT ROUND</button>
  </div>
  <div class="ovl" id="es" style="display:none">
    <h1 id="et"></h1><h2 id="ew"></h2>
    <button class="btn" onclick="showCharSelect()">PLAY AGAIN</button>
  </div>
</div>

<!-- CHARACTER SELECT -->
<div id="char-select">
  <h1>⚔ CHILL CLUB FIGHTER</h1>
  <h2>SELECT YOUR FIGHTER</h2>
  <div id="cs-grid"></div>
  <div id="cs-bottom">
    <div class="cs-preview" id="prev1">
      <img id="prev1-img" src="" alt="">
      <div class="cs-pname" id="prev1-name">---</div>
      <div class="cs-pdesc" id="prev1-desc"></div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;">
      <div id="cs-vs">VS</div>
      <div id="cs-p" style="margin-top:6px;">← choose your fighter</div>
      <button class="btn" id="cs-start" onclick="startFromSelect()" style="margin-top:8px;display:none;">FIGHT!</button>
    </div>
    <div class="cs-preview" id="prev2">
      <img id="prev2-img" src="" alt="">
      <div class="cs-pname" id="prev2-name">CPU</div>
      <div class="cs-pdesc" id="prev2-desc">Random opponent</div>
    </div>
  </div>
</div>
</div>

<!-- TOUCH -->
<div id="touch-ctrl">
  <div id="tc-left">
    <div class="tc-row">
      <button class="tcb t-jump" id="tc-jump">↑</button>
      <button class="tcb t-block" id="tc-block">BLK</button>
    </div>
    <div class="tc-row" style="margin-top:4px">
      <button class="tcb t-mv" id="tc-left-btn">◀</button>
      <button class="tcb t-mv" id="tc-crouch">▼</button>
      <button class="tcb t-mv" id="tc-right-btn">▶</button>
    </div>
  </div>
  <div id="tc-right">
    <div class="tc-row">
      <button class="tcb t-i" id="tc-i">WAVE</button>
      <button class="tcb t-u" id="tc-u">SPL</button>
      <button class="tcb t-sup" id="tc-sup">★SUPER</button>
    </div>
    <div class="tc-row" style="margin-top:4px">
      <button class="tcb t-j" id="tc-j">LIGHT</button>
      <button class="tcb t-k" id="tc-k">HEAVY</button>
    </div>
  </div>
</div>

function buildSprite(el, sp, flipped=false){
  el.innerHTML='';
  const s=sp;
  const parts=[
    // head
    {w:24,h:24,t:0,l:20,bg:s.head,border:`2px solid ${s.hair}`},
    // hair
    {w:28,h:8,t:0,l:18,bg:s.hair},
    // body
    {w:32,h:32,t:26,l:16,bg:s.body,border:`2px solid ${s.bodyBorder}`},
    // left arm
    {w:12,h:28,t:28,l:4,bg:s.arm,border:`2px solid ${s.armBorder}`},
    // right arm
    {w:12,h:28,t:28,l:48,bg:s.arm,border:`2px solid ${s.armBorder}`,id:'rarm'},
    // left leg
    {w:14,h:36,t:58,l:16,bg:s.legs,border:'2px solid #000'},
    // right leg
    {w:14,h:36,t:58,l:34,bg:s.legs,border:'2px solid #000'},
    // left shoe
    {w:18,h:8,t:88,l:12,bg:s.shoes},
    // right shoe
    {w:18,h:8,t:88,l:30,bg:s.shoes},
  ];
  parts.forEach(p=>{
    const d=document.createElement('div');
    d.style.cssText=`position:absolute;width:${p.w}px;height:${p.h}px;top:${p.t}px;left:${p.l}px;background:${p.bg||'transparent'};${p.border?`border:${p.border}`:''}`;
    if(p.id) d.id=el.id+'-'+p.id;
    el.appendChild(d);
  });
  el.style.transform=flipped?'scaleX(-1)':'';
}

// ============================================================
// CHARACTER SELECT UI
// ============================================================
let selectedChar=null, opponentChar=null;

function buildCharSelect(){
  const grid=document.getElementById('cs-grid');
  grid.innerHTML='';
  CHARS.forEach((c,i)=>{
    const card=document.createElement('div');
    card.className='cs-card';
    card.innerHTML=`<img src="${c.img}" alt="${c.short}" onerror="this.style.background='${c.color}';this.src=''">
      <div class="cs-name">${c.short}</div>
      <div class="cs-style" style="color:${c.color}">${c.desc.split('.')[0]}</div>`;
    card.onclick=()=>selectChar(i);
    grid.appendChild(card);
  });
}

function selectChar(i){
  selectedChar=i;
  document.querySelectorAll('.cs-card').forEach((c,j)=>c.classList.toggle('sel',j===i));
  const c=CHARS[i];
  document.getElementById('prev1-img').src=c.img;
  document.getElementById('prev1-img').style.borderColor=c.color;
  document.getElementById('prev1-name').textContent=c.short;
  document.getElementById('prev1-desc').textContent=c.desc;
  // Pick random opponent (different from player)
  let op=Math.floor(Math.random()*CHARS.length);
  while(op===i) op=Math.floor(Math.random()*CHARS.length);
  opponentChar=op;
  const oc=CHARS[op];
  document.getElementById('prev2-img').src=oc.img;
  document.getElementById('prev2-img').style.borderColor=oc.color;
  document.getElementById('prev2-name').textContent=oc.short;
  document.getElementById('prev2-desc').textContent=oc.desc;
  document.getElementById('cs-start').style.display='block';
  document.getElementById('cs-p').textContent='ready!';
}

function startFromSelect(){
  if(selectedChar===null) return;
  document.getElementById('char-select').style.display='none';
  initGame(selectedChar, opponentChar);
}

function showCharSelect(){
  document.getElementById('char-select').style.display='flex';
  document.getElementById('es').style.display='none';
  document.getElementById('ks').style.display='none';
  selectedChar=null; opponentChar=null;
  document.getElementById('cs-start').style.display='none';
  document.getElementById('cs-p').textContent='← choose your fighter';
  document.getElementById('prev1-img').src=''; document.getElementById('prev1-name').textContent='---';
  document.getElementById('prev2-img').src=''; document.getElementById('prev2-name').textContent='CPU';
  buildCharSelect();
}

// CONSTANTS
// ============================================================
const SL=40, SR=696, FW=64, FH=96;
const GROUND_Y=480-88-FH;
const GRAVITY=0.65, FASTFALL_V=8;
const MHP=100, MEN=100, RT=60;

// ============================================================
// GAME STATE
// ============================================================
let G={running:false,round:1,w1:0,w2:0,timer:RT,ti:null,
  p1:null,p2:null,c1:null,c2:null,
  keys:{},gl:null,ais:'approach',ait:1};

function makePlayer(x,charIdx){
  const c=CHARS[charIdx];
  return {hp:MHP,en:0,x,y:GROUND_Y,vy:0,
    state:'STAND',facing:1,cd:0,jumpAttacked:false,blk:false,
    charIdx};
}

function initGame(p1Idx, p2Idx){
  G.round=1; G.w1=0; G.w2=0;
  G.c1=CHARS[p1Idx]; G.c2=CHARS[p2Idx];
  document.getElementById('name1').textContent=G.c1.short;
  document.getElementById('name2').textContent=G.c2.short;
  document.getElementById('name1').style.color=G.c1.color;
  document.getElementById('name2').style.color=G.c2.color;
  document.getElementById('rn').textContent=1;
  // Build sprites
  buildSprite(document.getElementById('p1'), G.c1.sprite, false);
  buildSprite(document.getElementById('p2'), G.c2.sprite, true);
  // Floor color
  document.getElementById('floor').style.background=G.c1.color;
  document.getElementById('floor').style.boxShadow=`0 0 12px ${G.c1.color},0 4px 0 ${G.c2.color}`;
  updatePips();
  resetRound();
  G.running=true;
  ann('ROUND 1');
  setTimeout(()=>ann('FIGHT!'),1500);
  startTimer();
  lt=performance.now(); requestAnimationFrame(loop);
}

function resetRound(){
  G.p1=makePlayer(100,G.c1?CHARS.indexOf(G.c1):0);
  G.p2=makePlayer(640,G.c2?CHARS.indexOf(G.c2):1);
  G.p1.facing=1; G.p2.facing=-1;
  G.ais='approach'; G.ait=1;
  const p1e=document.getElementById('p1'), p2e=document.getElementById('p2');
  p1e.classList.remove('atk','atk-h','crouch','block','jump','hit');
  p2e.classList.remove('atk','atk-h','crouch','block','jump','hit');
  hud(); pos();
  document.getElementById('ks').style.display='none';
}

const tme=document.getElementById('timer'), rne=document.getElementById('rn');
const sfe=document.getElementById('sf'), gc=document.getElementById('gc');
const sh1=document.getElementById('sh1'), sh2=document.getElementById('sh2');
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function p1e(){return document.getElementById('p1');}
function p2e(){return document.getElementById('p2');}

function hud(){
  const q1=G.p1.hp/MHP*100, q2=G.p2.hp/MHP*100;
  const h1=document.getElementById('h1'), h2=document.getElementById('h2');
  h1.style.width=q1+'%'; h2.style.width=q2+'%';
  h1.className='hp'+(q1<=25?' r':q1<=50?' y':'');
  h2.className='hp'+(q2<=25?' r':q2<=50?' y':'');
  document.getElementById('e1').style.width=(G.p1.en/MEN*100)+'%';
  document.getElementById('e2').style.width=(G.p2.en/MEN*100)+'%';
  document.getElementById('e1').className='en'+(G.p1.en>=MEN?' full':'');
  document.getElementById('e2').className='en'+(G.p2.en>=MEN?' full':'');
  tme.textContent=Math.ceil(G.timer);
}

function pos(){
  const p1=document.getElementById('p1'), p2=document.getElementById('p2');
  p1.style.left=G.p1.x+'px'; p1.style.top=G.p1.y+'px';
  p2.style.left=G.p2.x+'px'; p2.style.top=G.p2.y+'px';
  function shadow(sh,p){
    const h=cl(1-(GROUND_Y-p.y)/160,0.1,1);
    const w=cl(24+26*h,18,52);
    sh.style.cssText=`width:${w}px;height:8px;left:${p.x+(FW-w)/2}px;top:${GROUND_Y+FH+2}px;opacity:${h*0.4};`;
  }
  shadow(sh1,G.p1); shadow(sh2,G.p2);
}

function flash(c='#ffffff'){sfe.style.background=c;sfe.style.opacity='.6';setTimeout(()=>sfe.style.opacity='0',85);}

function dmgTxt(x,y,d,c){
  const el=document.createElement('div'); el.className='dmgtxt'; el.textContent='-'+d;
  el.style.cssText=`left:${cl(x,10,750)}px;top:${cl(y,60,360)}px;color:${c||'#ffff00'}`;
  gc.appendChild(el); setTimeout(()=>el.remove(),1000);
}
function mvTxt(x,y,n,c){
  const el=document.createElement('div'); el.className='mvtxt'; el.textContent=n;
  el.style.cssText=`left:${cl(x,0,660)}px;top:${cl(y,60,340)}px;color:${c||'#ff00ff'}`;
  gc.appendChild(el); setTimeout(()=>el.remove(),1200);
}
function ann(t,d=1500){
  const o=document.getElementById('ann'); if(o)o.remove();
  const el=document.createElement('div'); el.id='ann'; el.textContent=t;
  el.style.animationDuration=d+'ms'; gc.appendChild(el); setTimeout(()=>el.remove(),d);
}

// ============================================================
// DAMAGE
// ============================================================
function dealDamage(atk,def,isP2,dmgAmt,moveName,kb,color){
  if(!G.running) return;
  const c=(isP2?G.c2:G.c1);
  const atkC=(isP2?G.c1:G.c2);
  const facingAtk=true; // auto-facing handles this
  if(def.state==='BLOCK'&&def.blk&&facingAtk){
    if(!isP2&&Math.random()<0.4) setTimeout(()=>dealDamage(G.p2,G.p1,false,14,'COUNTER!',0,G.c2.color),200);
    dmgAmt=Math.round(dmgAmt*0.1);
    mvTxt(def.x,def.y,'BLOCKED!','#888');
  }
  def.hp=Math.max(0,def.hp-dmgAmt);
  atk.en=Math.min(MEN,atk.en+8); def.en=Math.min(MEN,def.en+5);
  def.state='HIT';
  const defEl=isP2?p2e():p1e();
  defEl.classList.add('hit'); setTimeout(()=>{defEl.classList.remove('hit');if(def.state==='HIT')def.state='STAND';},200);
  if(dmgAmt>14) flash(isP2?atkC.color:c.color);
  if(isP2){ dmgTxt(def.x,def.y+40,dmgAmt,'#ffff00'); if(moveName)mvTxt(atk.x,def.y,''+moveName,color||atkC.color); if(kb)def.x=cl(def.x+kb,SL,SR); }
  else { dmgTxt(def.x,def.y+40,dmgAmt,'#ff6666'); if(moveName)mvTxt(cl(def.x-80,0,700),def.y,''+moveName,color||c.color); if(kb)def.x=cl(def.x-kb,SL,SR); }
  if(def.hp<=0) endRound();
}

// ============================================================
// JUMP
// ============================================================
function doJump(p,el){
  if(p.state==='JUMP') return;
  p.vy=G[p===G.p1?'c1':'c2'].stats.jump||JUMP_V; p.state='JUMP'; p.jumpAttacked=false;
  el.classList.add('jump');
}

// ============================================================
// PHYSICS
// ============================================================
function physics(){
  [G.p1,G.p2].forEach((p,i)=>{
    if(p.state==='JUMP'){
      p.vy+=GRAVITY; p.y+=p.vy;
      if(p.y>=GROUND_Y){ p.y=GROUND_Y; p.vy=0; if(p.state==='JUMP')p.state='STAND'; p.jumpAttacked=false; (i===0?p1e():p2e()).classList.remove('jump'); }
    } else { p.y=GROUND_Y; }
  });
  // soft push
  const onG1=G.p1.state!=='JUMP', onG2=G.p2.state!=='JUMP';
  if(onG1&&onG2){const ov=(G.p1.x+FW+4)-G.p2.x;if(ov>0){G.p1.x-=ov*0.5;G.p2.x+=ov*0.5;}}
  G.p1.x=cl(G.p1.x,SL,SR); G.p2.x=cl(G.p2.x,SL,SR);
}

// ============================================================
// PROJECTILES
// ============================================================
function spawnBullet(fromP2){
  const p=fromP2?G.p2:G.p1, op=fromP2?G.p1:G.p2;
  const c=fromP2?G.c2:G.c1;
  const el=document.createElement('div'); el.className='proj';
  const dir=p.facing; let x=dir>0?p.x+FW:p.x-14, y=p.y+46+Math.random()*14;
  el.style.cssText=`top:${y}px;left:${x}px;width:14px;height:8px;border-radius:4px;background:${c.color};box-shadow:0 0 8px ${c.color}`;
  gc.appendChild(el);
  const id=setInterval(()=>{
    x+=dir*13; el.style.left=x+'px';
    if(Math.abs(x-op.x)<FW&&y>op.y&&y<op.y+FH){ dealDamage(p,op,fromP2,4,null,0,c.color); el.remove();clearInterval(id); }
    if(x>870||x<-50){el.remove();clearInterval(id);}
  },28);
}

function spawnWave(fromP2){
  const p=fromP2?G.p2:G.p1, op=fromP2?G.p1:G.p2;
  const c=fromP2?G.c2:G.c1;
  const stateKey=p.state==='JUMP'?'air':p.state==='CROUCH'?'crouch':'stand';
  const M=c.moves.wave[stateKey];
  mvTxt(p.x,p.y+20,M.n||'WAVE',M.wc||c.color);
  const el=document.createElement('div'); el.className='proj';
  const dir=p.facing; let x=dir>0?p.x+FW:p.x-22, y=p.y+28, size=22, hit=false;
  el.style.cssText=`top:${y}px;left:${x}px;width:${size}px;height:${size}px;border-radius:50%;border:3px solid ${M.wc||c.color};box-shadow:0 0 12px ${M.wc||c.color}`;
  gc.appendChild(el);
  const id=setInterval(()=>{
    x+=dir*9; size=Math.min(size+2.5,60);
    const yo=(size-22)/2;
    el.style.left=x+'px'; el.style.top=(y-yo)+'px'; el.style.width=size+'px'; el.style.height=size+'px';
    if(!hit&&Math.abs(x-op.x)<FW+size/2&&(y-yo)<op.y+FH&&(y-yo+size)>op.y){
      dealDamage(p,op,fromP2,22,M.n,35,M.wc||c.color); hit=true; el.remove(); clearInterval(id);
    }
    if(x>870||x<-60){el.remove();clearInterval(id);}
  },22);
}

function spawnShockwave(x,y,color){
  const el=document.createElement('div'); el.className='shockwave';
  el.style.cssText=`left:${x+FW/2}px;top:${y+FH-14}px;border:4px solid ${color||'#ff6600'};box-shadow:0 0 20px ${color||'#ff6600'}`;
  gc.appendChild(el); setTimeout(()=>el.remove(),450);
}

// ============================================================
// ATTACK ENGINE
// ============================================================
function doAttack(p, isP2, type){
  if(!G.running||p.cd>0) return;
  const c=isP2?G.c2:G.c1;
  const op=isP2?G.p1:G.p2;
  const inAir=p.state==='JUMP', crouch=p.state==='CROUCH';
  const stateKey=inAir?'air':crouch?'crouch':'stand';
  const am=c.stats.atkMult||1;

  // Energy gate
  if(type==='wave'){
    const M=c.moves.wave[stateKey]; if(!M) return;
    if(p.en<30) return; p.en-=30; p.cd=M.cd;
    spawnWave(isP2); return;
  }
  if(type==='super'){
    const M=c.moves.super; if(!M) return;
    if(p.en<M.ec) return; p.en-=M.ec; p.cd=M.cd;
    flash(M.flashC||c.color); ann(M.n+'!!');
    dealDamage(p,op,isP2,Math.round(M.d*am),M.n,0,M.c); return;
  }

  const MG=c.moves[type]; if(!MG) return;
  const M=MG[stateKey]; if(!M) return;

  if(type==='special'){
    if(p.en<25) return; p.en-=25; p.cd=M.cd;
    const cnt=M.multi||5;
    mvTxt(p.x,p.y+30,M.n,M.c||c.color);
    for(let i=0;i<cnt;i++) setTimeout(()=>spawnBullet(isP2),i*90);
    return;
  }

  p.cd=M.cd;
  const el=isP2?p2e():p1e();
  el.classList.add(M.d>18?'atk-h':'atk');
  setTimeout(()=>{el.classList.remove('atk','atk-h');if(p.state==='ATTACK'||p.state==='ATK-H')p.state=inAir?'JUMP':'STAND';},220);

  if(M.bassDrop){
    mvTxt(p.x,p.y+10,M.n,M.c||c.color);
    const dist=Math.abs(op.x-p.x);
    if(dist<M.rng) dealDamage(p,op,isP2,Math.round(M.d*am),null,0,M.c||c.color);
    const lc=setInterval(()=>{if(p.state!=='JUMP'){spawnShockwave(p.x,p.y,M.c||c.color);flash(M.c||c.color);if(Math.abs(op.x-p.x)<140)dealDamage(p,op,isP2,10,'SHOCKWAVE',45,M.c||c.color);clearInterval(lc);}},40);
    return;
  }

  const dist=Math.abs(op.x-p.x);
  if(dist<M.rng+(inAir?30:0)){
    dealDamage(p,op,isP2,Math.round(M.d*am),M.n,M.kb||0,M.c||c.color);
    p.en=Math.min(MEN,p.en+8);
  }
}

// ============================================================
// AI
// ============================================================
function runAI(dt){
  const dist=Math.abs(G.p2.x-G.p1.x);
  G.ait-=dt; if(G.p2.cd>0)G.p2.cd-=dt*60;
  if(G.ait<=0){
    const r=Math.random();
    if(G.p2.hp<30&&G.p2.en>=MEN)      G.ais='super';
    else if(dist>180)                  G.ais='approach';
    else if(r<.25)                     G.ais='light';
    else if(r<.42)                     G.ais='heavy';
    else if(r<.55&&G.p2.en>=25)       G.ais='special';
    else if(r<.63&&G.p2.en>=30)       G.ais='wave';
    else if(r<.72)                     G.ais='jump';
    else if(r<.84)                     G.ais='block';
    else                               G.ais='retreat';
    G.ait=.3+Math.random()*.7;
  }
  if(G.p2.cd>0) return;
  const toward=G.p1.x<G.p2.x?-2:2;
  const away=G.p1.x<G.p2.x?1.5:-1.5;
  switch(G.ais){
    case 'approach': G.p2.x=cl(G.p2.x+toward,SL,SR); G.p2.state='WALK'; break;
    case 'retreat':  G.p2.x=cl(G.p2.x+away,SL,SR); G.p2.state='WALK'; break;
    case 'light':    doAttack(G.p2,true,'light'); break;
    case 'heavy':    doAttack(G.p2,true,'heavy'); break;
    case 'special':  doAttack(G.p2,true,'special'); break;
    case 'wave':     doAttack(G.p2,true,'wave'); break;
    case 'jump':     doJump(G.p2,p2e()); break;
    case 'super':    doAttack(G.p2,true,'super'); break;
    case 'block':
      G.p2.blk=true; G.p2.state='BLOCK'; p2e().classList.add('block');
      setTimeout(()=>{G.p2.blk=false;if(G.p2.state==='BLOCK'){G.p2.state='STAND';p2e().classList.remove('block');}},550); break;
  }
}

// ============================================================
// INPUT
// ============================================================
let lastKeyTime={a:0,d:0};
document.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); G.keys[k]=true;
  if(!G.running) return;
  if(k==='a'||k==='d'){const now=Date.now(),dir=k==='a'?-1:1;if(now-lastKeyTime[k]<200&&G.p1.state!=='JUMP'){G.p1.x=cl(G.p1.x+dir*80,SL,SR);mvTxt(G.p1.x,G.p1.y+20,dir>0?'DASH →':'← DASH','#fff');}lastKeyTime[k]=now;}
  switch(k){
    case 'w': doJump(G.p1,p1e()); break;
    case 's':
      if(G.p1.state==='JUMP'){G.p1.vy=Math.max(G.p1.vy,FASTFALL_V);}
      else{G.p1.state='CROUCH';p1e().classList.add('crouch');}
      break;
    case 'j': doAttack(G.p1,false,'light'); break;
    case 'k': doAttack(G.p1,false,'heavy'); break;
    case 'u': doAttack(G.p1,false,'special'); break;
    case 'i': doAttack(G.p1,false,'wave'); break;
    case 'l': doAttack(G.p1,false,'super'); break;
  }
  e.preventDefault();
});
document.addEventListener('keyup',e=>{
  const k=e.key.toLowerCase(); G.keys[k]=false;
  if(k==='s'){G.p1.state='STAND';p1e().classList.remove('crouch');}
  if(k==='a'&&G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
});

// ============================================================
// GAME LOOP
// ============================================================
let lt=0;
function loop(ts){
  if(!G.running) return;
  const dt=Math.min((ts-lt)/1000,.05); lt=ts;
  const spd=(G.p1.state!=='JUMP'?G.c1.stats.spd:2.8)||3.5;
  const onGround=G.p1.state!=='JUMP';

  if(G.keys['a']){
    G.p1.x=cl(G.p1.x-spd,SL,SR);
    if(onGround&&G.p1.state!=='CROUCH'&&G.p1.state!=='HIT'&&G.p1.state!=='ATTACK'&&G.p2.x>G.p1.x){
      G.p1.blk=true; G.p1.state='BLOCK'; p1e().classList.add('block');
    }
  } else if(G.keys['d']){
    G.p1.x=cl(G.p1.x+spd,SL,SR);
    if(onGround&&G.p1.state!=='CROUCH'&&G.p1.state!=='HIT'&&G.p1.state!=='ATTACK'&&G.p2.x<G.p1.x){
      G.p1.blk=true; G.p1.state='BLOCK'; p1e().classList.add('block');
    } else if(G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
  } else {
    if(G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}
  }
  if(G.p1.cd>0) G.p1.cd-=dt*60;

  physics();

  // Auto-facing
  if(G.p1.state!=='ATTACK'&&G.p1.state!=='ATK-H'){const f=G.p2.x>G.p1.x?1:-1;if(f!==G.p1.facing){G.p1.facing=f;p1e().style.transform=f===1?'':'scaleX(-1)';}}
  if(G.p2.state!=='ATTACK'&&G.p2.state!=='ATK-H'){const f=G.p1.x>G.p2.x?1:-1;if(f!==G.p2.facing){G.p2.facing=f;p2e().style.transform=f===1?'scaleX(-1)':'';}}

  runAI(dt);
  hud(); pos();
  G.gl=requestAnimationFrame(loop);
}

// ============================================================
// TIMER + ROUND
// ============================================================
function startTimer(){G.timer=RT;G.ti=setInterval(()=>{if(!G.running)return;G.timer--;if(G.timer<=0){G.timer=0;endRound(true);}},1000);}
function endRound(to=false){
  if(!G.running) return;
  G.running=false; cancelAnimationFrame(G.gl); clearInterval(G.ti);
  const w=to?(G.p1.hp>=G.p2.hp?1:2):(G.p1.hp<=0?2:1);
  if(w===1)G.w1++;else G.w2++; updatePips(); ann(to?'TIME!':'K.O.!');
  setTimeout(()=>{
    if(G.w1>=2||G.w2>=2){endGame();return;}
    document.getElementById('kt').textContent=to?'TIME!':'K.O.!';
    document.getElementById('kw').textContent=w===1?`🏆 ${G.c1.short} WINS!`:`🏆 ${G.c2.short} WINS!`;
    document.getElementById('ksc').textContent=`${G.c1.short} ${G.w1} - ${G.w2} ${G.c2.short}`;
    document.getElementById('ks').style.display='flex';
  },1800);
}
function nextRound(){
  G.round++; rne.textContent=G.round; resetRound();
  ann('ROUND '+G.round);
  setTimeout(()=>{ann('FIGHT!');G.running=true;startTimer();lt=performance.now();requestAnimationFrame(loop);},1500);
}
function endGame(){
  document.getElementById('et').textContent=G.w1>G.w2?'WINNER!':'GAME OVER';
  document.getElementById('ew').textContent=G.w1>G.w2?`🏆 ${G.c1.short} CHAMPION!`:`🏆 ${G.c2.short} WINS!`;
  document.getElementById('es').style.display='flex';
}
function updatePips(){
  for(let i=0;i<2;i++){
    document.getElementById('p1p'+i).className='pip'+(i<G.w1?' won':'');
    document.getElementById('p2p'+i).className='pip'+(i<G.w2?' won':'');
  }
}

// ============================================================
// TOUCH
// ============================================================
function bindBtn(id,onD,onU){const el=document.getElementById(id);if(!el)return;el.addEventListener('touchstart',e=>{e.preventDefault();onD();},{passive:false});el.addEventListener('touchend',e=>{e.preventDefault();if(onU)onU();},{passive:false});el.addEventListener('mousedown',onD);if(onU)el.addEventListener('mouseup',onU);}
bindBtn('tc-jump',()=>{if(G.running&&G.p1)doJump(G.p1,p1e());});
bindBtn('tc-crouch',()=>{G.keys['s']=true;if(G.running&&G.p1){if(G.p1.state==='JUMP')G.p1.vy=Math.max(G.p1.vy,FASTFALL_V);else{G.p1.state='CROUCH';p1e().classList.add('crouch');}}},()=>{G.keys['s']=false;if(G.p1&&G.p1.state==='CROUCH'){G.p1.state='STAND';p1e().classList.remove('crouch');}});
bindBtn('tc-left-btn',()=>{G.keys['a']=true;},()=>{G.keys['a']=false;if(G.p1&&G.p1.state==='BLOCK'){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}});
bindBtn('tc-right-btn',()=>{G.keys['d']=true;},()=>{G.keys['d']=false;});
bindBtn('tc-block',()=>{if(G.p1){G.p1.blk=true;G.p1.state='BLOCK';p1e().classList.add('block');}},()=>{if(G.p1){G.p1.blk=false;G.p1.state='STAND';p1e().classList.remove('block');}});
bindBtn('tc-j',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'light');});
bindBtn('tc-k',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'heavy');});
bindBtn('tc-u',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'special');});
bindBtn('tc-i',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'wave');});
bindBtn('tc-sup',()=>{if(G.running&&G.p1)doAttack(G.p1,false,'super');});

// ============================================================
// MOBILE SCALING
// ============================================================
function scaleGame(){
  const wrap=document.getElementById('game-wrap');
  const avail=Math.min(window.innerWidth,800);
  if(avail<800){const s=avail/800;gc.style.transformOrigin='top left';gc.style.transform='scale('+s+')';wrap.style.height=(480*s)+'px';}
  else{gc.style.transform='';wrap.style.height='480px';}
}
scaleGame(); window.addEventListener('resize',scaleGame);

// ============================================================
// INIT
// ============================================================
buildCharSelect();
</script>
